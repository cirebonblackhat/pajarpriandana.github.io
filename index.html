<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Deteksi Wajah & Tangan</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { margin: 10px 0 4px; font-size: 1.4rem; }
  p.sub { margin: 0 0 16px; color: #94a3b8; font-size: 0.9rem; text-align: center; }
  .wrap {
    position: relative;
    width: 100%;
    max-width: 720px;
    aspect-ratio: 4 / 3;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    background: #000;
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
  video { display: none; }
  .status {
    margin-top: 14px;
    font-size: 0.9rem;
    color: #38bdf8;
    min-height: 20px;
  }
  .legend {
    display: flex;
    gap: 18px;
    margin-top: 10px;
    font-size: 0.85rem;
    color: #cbd5e1;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<h1>👁️ Deteksi Wajah &amp; Tangan</h1>
<p class="sub">Berjalan langsung di browser memakai MediaPipe. Izinkan akses kamera saat diminta.</p>

<div class="wrap">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div class="legend">
  <span><span class="dot" style="background:#22c55e"></span> Wajah</span>
  <span><span class="dot" style="background:#38bdf8"></span> Tangan</span>
</div>
<div class="status" id="status">Memuat model...</div>

<!-- MediaPipe (Face Detection + Hands) via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('canvas');
const ctx = canvasEl.getContext('2d');
const statusEl = document.getElementById('status');

let faceResult = null;
let handsResult = null;

// ---------- Setup Face Detection ----------
const faceDetection = new FaceDetection({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
});
faceDetection.setOptions({
  model: 'short',
  minDetectionConfidence: 0.6
});
faceDetection.onResults((results) => {
  faceResult = results;
  drawAll();
});

// ---------- Setup Hands ----------
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.5
});
hands.onResults((results) => {
  handsResult = results;
  drawAll();
});

// ---------- Gambar ulang canvas tiap ada hasil baru ----------
function drawAll() {
  canvasEl.width = videoEl.videoWidth || 640;
  canvasEl.height = videoEl.videoHeight || 480;

  ctx.save();
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  // Mirror biar seperti cermin
  ctx.translate(canvasEl.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

  // Gambar wajah
  if (faceResult && faceResult.detections) {
    faceResult.detections.forEach((det) => {
      const box = det.boundingBox;
      const x = (box.xCenter - box.width / 2) * canvasEl.width;
      const y = (box.yCenter - box.height / 2) * canvasEl.height;
      const w = box.width * canvasEl.width;
      const h = box.height * canvasEl.height;
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);
    });
  }

  // Gambar tangan
  if (handsResult && handsResult.multiHandLandmarks) {
    for (const landmarks of handsResult.multiHandLandmarks) {
      drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: '#38bdf8', lineWidth: 3 });
      drawLandmarks(ctx, landmarks, { color: '#f97316', lineWidth: 1, radius: 4 });
    }
  }

  ctx.restore();

  const jumlahWajah = faceResult?.detections?.length || 0;
  const jumlahTangan = handsResult?.multiHandLandmarks?.length || 0;
  statusEl.textContent = `Wajah terdeteksi: ${jumlahWajah} | Tangan terdeteksi: ${jumlahTangan}`;
}

// ---------- Kamera ----------
const camera = new Camera(videoEl, {
  onFrame: async () => {
    await faceDetection.send({ image: videoEl });
    await hands.send({ image: videoEl });
  },
  width: 640,
  height: 480
});

navigator.mediaDevices.getUserMedia({ video: true })
  .then(() => {
    camera.start();
    statusEl.textContent = 'Kamera aktif, mendeteksi...';
  })
  .catch((err) => {
    statusEl.textContent = 'Gagal mengakses kamera: ' + err.message;
  });
</script>

</body>
</html>
